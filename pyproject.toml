[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name (chaos-agents was already taken). The import package
# and the CLI command stay `chaos_agents` / `chaos-agents` on purpose.
name = "chaos-bringer"
version = "0.3.0"
description = "A chaos monkey for agent frameworks: fuzz, fault-inject, and red-team any agent for free."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "themaker00001" }]
keywords = [
    "ai", "agents", "llm", "security", "red-team", "prompt-injection",
    "chaos-engineering", "fuzzing", "mcp", "a2a", "ollama",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/themaker00001/chaos-bringer"
Repository = "https://github.com/themaker00001/chaos-bringer"
Issues = "https://github.com/themaker00001/chaos-bringer/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "Pillow>=10.0"]  # Pillow: only tools/mascot, never at runtime
rich = ["rich>=13.0"]

[project.scripts]
chaos-agents = "chaos_agents.cli:main"

# Plugin surfaces. Third parties register into the same groups via their own
# package's entry-points -- these built-ins go through the identical path,
# nothing about them is hardcoded into the registry.
[project.entry-points."chaos_agents.providers"]
ollama = "chaos_agents.providers.ollama:OllamaProvider"

[project.entry-points."chaos_agents.adapters"]
echo = "chaos_agents.adapters.echo:EchoAdapter"
parrot = "chaos_agents.adapters.parrot:ParrotAdapter"
generic_proxy = "chaos_agents.adapters.proxy:GenericProxyAdapter"
ollama_chat = "chaos_agents.adapters.ollama_chat:OllamaChatAdapter"
mcp_fault = "chaos_agents.adapters.mcp_fault:McpFaultProxy"
a2a = "chaos_agents.adapters.a2a:A2AAdapter"
chatgpt_app = "chaos_agents.adapters.mcp_app:McpAppAdapter"
sandbox = "chaos_agents.adapters.sandbox:SandboxTarget"
toolbot = "chaos_agents.adapters.toolbot:ToolBotAdapter"
fortress = "chaos_agents.adapters.fortress:FortressAdapter"
a2a_trust = "chaos_agents.adapters.a2a_trust:A2ATrustAdapter"

[project.entry-points."chaos_agents.vectors"]
static_corpus = "chaos_agents.vectors.static_corpus:StaticCorpusVector"
llm = "chaos_agents.vectors.llm:LLMVector"
multiturn = "chaos_agents.vectors.multiturn:MultiTurnVector"
indirect = "chaos_agents.vectors.indirect:IndirectVector"
mutation = "chaos_agents.vectors.mutation:MutationVector"
memory_poison = "chaos_agents.vectors.memory_poison:MemoryPoisonVector"
adaptive_memory = "chaos_agents.adaptive:AdaptiveMemoryVector"
adaptive_corpus = "chaos_agents.adaptive:AdaptiveCorpusVector"

[project.entry-points."chaos_agents.judges"]
rule_based = "chaos_agents.judges.rule_based:RuleBasedJudge"
llm = "chaos_agents.judges.llm:LLMJudge"

[tool.setuptools.packages.find]
where = ["src"]
